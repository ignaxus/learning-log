{% extends "learning_logs/base.html" %}

{% block content %}

<h1>Delete Entry</h1>

<p>Are you sure you want to delete this entry?</p>

<p>
    <strong>Topic:</strong> {{ topic.text }}
</p>

<p>
    {{ entry.text }}
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Delete
    </button>
</form>

<p>
    <a href="{% url 'learning_logs:topic' topic.id %}">
        Cancel
    </a>
</p>

{% endblock content %}
