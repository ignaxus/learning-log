{% load django_bootstrap5 %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>学习笔记</title>

    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="{% url 'learning_logs:home' %}">
            学习笔记
        </a>

        {% if user.is_authenticated %}

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'learning_logs:topics' %}">
                        主题
                    </a>
                </li>

            </ul>
            
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="{% url 'users:my_account' %}">
                        我的账号
                    </a>
                </li>

            </ul>

        {% endif %}

    </div>
</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock content %}

</div>

</body>
</html>
