{% extends "learning_logs/base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="mb-0">Topics</h1>

    <a class="btn btn-primary"
       href="{% url 'learning_logs:new_topic' %}">
        Add Topic
    </a>

</div>

{% for topic in topics %}

    <div class="card mb-3">

        <div class="card-body d-flex justify-content-between align-items-center">

            <a class="text-decoration-none fs-5"
               href="{% url 'learning_logs:topic' topic.id %}">
                {{ topic.text }}
            </a>

            <div>

                <a class="btn btn-outline-secondary btn-sm"
                   href="{% url 'learning_logs:edit_topic' topic.id %}">
                    Edit
                </a>

                <a class="btn btn-outline-danger btn-sm"
                   href="{% url 'learning_logs:delete_topic' topic.id %}">
                    Delete
                </a>

            </div>

        </div>

    </div>

{% empty %}

    <div class="alert alert-light border">
        No topics have been added yet.
    </div>

{% endfor %}

{% endblock content %}
