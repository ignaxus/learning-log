{% extends "learning_logs/base.html" %}

{% block content %}

<div class="card">
    <div class="card-body">

        <h3>Delete Topic</h3>

        <p>
            Are you sure you want to delete
            <strong>{{ topic.text }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit">
                Delete
            </button>

            <a href="{% url 'learning_logs:topics' %}">
                Cancel
            </a>

        </form>

    </div>
</div>

{% endblock content %}
