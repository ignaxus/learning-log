{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card">

            <div class="card-body">

                <h2 class="card-title mb-4">
                    注册账户
                </h2>

                <form method="post"
                      action="{% url 'users:register' %}">

                    {% csrf_token %}

                    {% bootstrap_form form %}

                    <button class="btn btn-primary"
                            name="submit">
                        注册
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
