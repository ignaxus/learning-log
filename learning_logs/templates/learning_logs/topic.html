{% extends "learning_logs/base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="mb-0">{{ topic.text }}</h1>

    <a class="btn btn-primary"
       href="{% url 'learning_logs:new_entry' topic.id %}">
        新建笔记
    </a>

</div>

{% for entry in entries %}

    <div class="card mb-4">

        <div class="card-header bg-secondary text-white">

            <div>
                <strong>
                    创建日期:
                    {{ entry.date_added|date:"Y年n月j日 H:i" }}
                </strong>
            </div>

            <div class="small text-light mt-1">
                上一次修改:
                {{ entry.date_modified|date:"Y年n月j日 H:i" }}
            </div>

        </div>

        <div class="card-body">

            {{ entry.text|linebreaks }}

        </div>

        <div class="card-footer text-end">

            <a class="btn btn-outline-secondary btn-sm"
               href="{% url 'learning_logs:edit_entry' entry.id %}">
                修改
            </a>

            <a class="btn btn-outline-danger btn-sm"
               href="{% url 'learning_logs:delete_entry' entry.id %}">
                删除
            </a>

        </div>

    </div>

{% empty %}

    <div class="alert alert-light border">
        你还没有任何笔记
    </div>

{% endfor %}

{% endblock content %}
